name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -euo pipefail
          # Keep entitlements so Sideloadly can re-sign HealthKit.
          xcodebuild \
            -project NOCORunning.xcodeproj \
            -scheme NOCORunning \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath Derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Embed HealthKit entitlements for sideload
        run: |
          set -euo pipefail
          APP=$(find ios/Derived -name "NOCORunning.app" -path "*iphoneos*" | head -n 1)
          ENT="ios/NOCORunning/NOCORunning.entitlements"
          echo "App: $APP"
          # Ad-hoc sign with HealthKit entitlements so Sideloadly preserves them.
          codesign --force --sign - --entitlements "$ENT" --timestamp=none "$APP" || true
          codesign -d --entitlements :- "$APP" || true
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSHealthUpdateUsageDescription' "$APP/Info.plist"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find ios/Derived -name "NOCORunning.app" -path "*iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "NOCORunning.app not found"
            find ios/Derived -name "*.app" | head
            exit 1
          fi
          echo "Packaging $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/NOCORunning.app
          mkdir -p output
          rm -f output/NOCORunning.ipa
          zip -r output/NOCORunning.ipa Payload
          ls -lh output/NOCORunning.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOCORunning-ipa
          path: output/NOCORunning.ipa
          if-no-files-found: error
          retention-days: 14
